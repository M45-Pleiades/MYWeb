<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="个人天文摄影作品集 —— 梅西耶天体与非梅西耶深空天体，包含星团、星云与星系。">
  <title>梅西耶之旅 · Deep Sky Journey</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="blackhole" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <header class="site-head">
    <span class="eyebrow">Deep Sky Astrophotography</span>
    <h1>梅西耶之旅</h1>
    <p class="subtitle" id="subtitle"></p>
    <div class="rule"></div>
  </header>

  <div class="tabs" id="tabs" role="tablist" aria-label="天体类别">
    <button class="tab active" data-cat="messier" role="tab" aria-selected="true">梅西耶天体</button>
    <button class="tab" data-cat="deepsky" role="tab" aria-selected="false">深空天体</button>
  </div>

  <div class="status">
    <span id="stat">加载中…</span>
    <span class="counter" id="pageLabel">01 / 01</span>
  </div>

  <main class="grid" id="grid"></main>

  <nav class="pager" id="pager" aria-label="分页导航"></nav>

  <footer class="site-foot">
    <span id="footTitle">梅西耶之旅 · Messier Journey</span> &nbsp;|&nbsp; 点击图片可放大 &nbsp;|&nbsp;
    键盘 <span class="accent">←</span> <span class="accent">→</span> 翻页
  </footer>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="图片预览">
    <button class="lb-close" id="lbClose" aria-label="关闭">&times;</button>
    <button class="lb-arrow prev" id="lbPrev" aria-label="上一张">&#8249;</button>
    <div class="lb-stage">
      <img id="lbImg" alt="">
      <div class="lb-info">
        <div class="lb-cap" id="lbCap"></div>
        <div class="lb-count" id="lbCount"></div>
      </div>
    </div>
    <button class="lb-arrow next" id="lbNext" aria-label="下一张">&#8250;</button>
  </div>

  <script src="js/data.js" defer></script>
  <script src="js/data-deepsky.js" defer></script>
  <script src="js/blackhole.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
